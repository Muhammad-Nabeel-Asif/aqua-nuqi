name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        type: choice
        options: [dev, stable]
        default: dev

permissions:
  contents: write

# Push and stable must not share a group: a docs push must never cancel a
# mid-flight stable publish. Only cancel overlapping push/dev runs.
concurrency:
  group: build-release-${{ github.ref }}-${{ github.event_name }}-${{ github.event.inputs.channel || 'dev' }}
  cancel-in-progress: ${{ github.event.inputs.channel != 'stable' }}

env:
  NODE_VERSION: '24'

jobs:
  # ---------------------------------------------------------------
  # Gate: nothing gets built, let alone released, if this fails.
  # ---------------------------------------------------------------
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Playwright Electron E2E
        run: xvfb-run --auto-servernum npm run test:e2e

  # ---------------------------------------------------------------
  # Windows: builds the installer AND creates a DRAFT release.
  # Draft stays unpublished until Linux attaches its assets, so a
  # cancelled/failed Linux job cannot leave a half-complete "latest".
  # ---------------------------------------------------------------
  build-windows:
    needs: quality
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed for commit-based release notes

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Derive version and channel
        id: version
        shell: bash
        run: |
          # Base version comes from package.json (e.g. 0.4.0 after Phase 4);
          # the patch position is the build number so it always increases.
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="${BASE}.${{ github.run_number }}"
          CHANNEL="${{ github.event.inputs.channel || 'dev' }}"
          if [ "$CHANNEL" = "stable" ]; then PRERELEASE=false; else PRERELEASE=true; fi
          echo "version=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$VERSION"   >> "$GITHUB_ENV"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - run: npm ci
      - name: Build Windows installer
        run: npm run dist:win
      - name: Packaged portable smoke
        run: npm run test:smoke:win
        continue-on-error: true

      - name: Generate release notes
        id: notes
        shell: bash
        env:
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: node scripts/release-notes.mjs "$APP_VERSION" > RELEASE_NOTES.md

      - uses: actions/upload-artifact@v7
        with:
          name: Aqua-Nuqi-Windows
          path: release/*.exe
          if-no-files-found: error

      - name: Create draft release (Windows assets)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Aqua Nuqi v${{ env.APP_VERSION }}
          body_path: RELEASE_NOTES.md
          draft: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: false
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------
  # Ubuntu: appends its artifacts, then publishes the draft.
  # ---------------------------------------------------------------
  build-linux:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Apply the same version
        run: npm version "${{ needs.build-windows.outputs.version }}" --no-git-tag-version --allow-same-version

      - run: npm ci
      - run: npm run dist:linux
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Packaged AppImage smoke
        run: xvfb-run --auto-servernum npm run test:smoke:linux
        continue-on-error: true

      - uses: actions/upload-artifact@v7
        with:
          name: Aqua-Nuqi-Linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

      # softprops with draft:false creates a *second* release for the same tag and
      # fails with already_exists. Attach into the Windows draft with `gh release
      # upload`, then undraft that single release.
      - name: Attach Ubuntu builds and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ needs.build-windows.outputs.version }}"
          PRERELEASE="${{ needs.build-windows.outputs.prerelease }}"

          shopt -s nullglob
          assets=(release/*.AppImage release/*.deb release/latest-linux.yml)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No Linux release assets found under release/" >&2
            exit 1
          fi

          gh release upload "$TAG" "${assets[@]}" --clobber

          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi

          echo "Published $TAG"
