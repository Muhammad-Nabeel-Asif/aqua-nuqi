name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        type: choice
        options: [dev, stable]
        default: dev

permissions:
  contents: write

# Push and stable must not share a group: a docs push must never cancel a
# mid-flight stable publish. Only cancel overlapping push/dev runs.
concurrency:
  group: build-release-${{ github.ref }}-${{ github.event_name }}-${{ github.event.inputs.channel || 'dev' }}
  cancel-in-progress: ${{ github.event.inputs.channel != 'stable' }}

env:
  NODE_VERSION: '24'

jobs:
  # ---------------------------------------------------------------
  # Gate: nothing gets built, let alone released, if this fails.
  # ---------------------------------------------------------------
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # ---------------------------------------------------------------
  # Windows: builds the installer AND creates a DRAFT release.
  # Draft stays unpublished until Linux attaches its assets, so a
  # cancelled/failed Linux job cannot leave a half-complete "latest".
  # ---------------------------------------------------------------
  build-windows:
    needs: quality
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for commit-based release notes

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Derive version and channel
        id: version
        shell: bash
        run: |
          # Base version comes from package.json (e.g. 0.4.0 after Phase 4);
          # the patch position is the build number so it always increases.
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="${BASE}.${{ github.run_number }}"
          CHANNEL="${{ github.event.inputs.channel || 'dev' }}"
          if [ "$CHANNEL" = "stable" ]; then PRERELEASE=false; else PRERELEASE=true; fi
          echo "version=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$VERSION"   >> "$GITHUB_ENV"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - run: npm ci
      - name: Build Windows installer
        run: npm run dist:win

      - name: Generate release notes
        id: notes
        shell: bash
        env:
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: node scripts/release-notes.mjs "$APP_VERSION" > RELEASE_NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: Aqua-Nuqi-Windows
          path: release/*.exe
          if-no-files-found: error

      - name: Create draft release (Windows assets)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Aqua Nuqi v${{ env.APP_VERSION }}
          body_path: RELEASE_NOTES.md
          draft: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: false
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------
  # Ubuntu: appends its artifacts, then publishes the draft.
  # ---------------------------------------------------------------
  build-linux:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Apply the same version
        run: npm version "${{ needs.build-windows.outputs.version }}" --no-git-tag-version --allow-same-version

      - run: npm ci
      - run: npm run dist:linux

      - uses: actions/upload-artifact@v4
        with:
          name: Aqua-Nuqi-Linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

      # softprops with draft:false creates a *second* release for the same tag, then
      # fails finalizing with already_exists. Upload into the Windows draft via gh,
      # then undraft that single release.
      - name: Attach Ubuntu builds and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.build-windows.outputs.version }}"
          TAG="v${VERSION}"
          PRERELEASE="${{ needs.build-windows.outputs.prerelease }}"

          shopt -s nullglob
          assets=(release/*.AppImage release/*.deb release/latest-linux.yml)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No Linux release assets found under release/" >&2
            exit 1
          fi

          # Prefer the draft Windows created; fall back to any release with this tag.
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\" and .draft == true) | .id" | head -n1)
          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          fi
          if [ -z "$RELEASE_ID" ]; then
            echo "No GitHub release found for tag $TAG" >&2
            exit 1
          fi

          for f in "${assets[@]}"; do
            name=$(basename "$f")
            existing=$(gh api "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" \
              --jq ".[] | select(.name == \"$name\") | .id" | head -n1 || true)
            if [ -n "${existing:-}" ]; then
              gh api --method DELETE "repos/${{ github.repository }}/releases/assets/${existing}"
            fi
            gh api --method POST \
              -H "Content-Type: application/octet-stream" \
              "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${name}" \
              --input "$f"
          done

          if [ "$PRERELEASE" = "true" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/releases/${RELEASE_ID}" \
              -F draft=false -F prerelease=true -f make_latest=false
          else
            gh api --method PATCH "repos/${{ github.repository }}/releases/${RELEASE_ID}" \
              -F draft=false -F prerelease=false -f make_latest=true
          fi

          echo "Published $TAG (release id $RELEASE_ID)"
